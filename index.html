<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Replay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: monospace; }

    #drop-zone {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #aaa; font-size: 1.4rem; gap: 1rem;
      border: 2px dashed #333; transition: border-color 0.2s, color 0.2s;
    }
    #drop-zone.drag-over { border-color: #f90; color: #f90; }
    #drop-zone.hidden { display: none; }

    .browse-btn {
      cursor: pointer; background: #222;
      padding: 8px 18px; border-radius: 4px;
      border: 1px solid #444; font-size: 0.9rem; color: #aaa;
    }
    .browse-btn:hover { border-color: #888; color: #fff; }

    #status {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 6px 14px; border-radius: 4px;
      font-size: 0.85rem; pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    #status.visible { opacity: 1; }

    #controls {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,0,0,0.75); padding: 10px 16px; color: #fff;
    }
    #controls.hidden { display: none; }
    #scrubber { flex: 1; cursor: pointer; accent-color: #f90; }

    button {
      background: #333; border: none; color: #fff;
      padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 1rem;
    }
    button:hover { background: #555; }

    select {
      background: #333; color: #fff; border: none;
      padding: 4px 6px; border-radius: 3px; cursor: pointer;
    }

    #tick-display { font-size: 0.8rem; color: #aaa; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="drop-zone">
    <div>Drop a CS2 .dem file</div>
    <span style="font-size:0.85rem;color:#555">or</span>
    <label class="browse-btn">
      Browse file
      <input type="file" accept=".dem" id="file-input" style="display:none" />
    </label>
  </div>

  <div id="status"></div>

  <div id="controls" class="hidden">
    <button id="play-pause">▶</button>
    <input type="range" id="scrubber" min="0" max="1" value="0" step="1" />
    <span id="tick-display">0 / 0</span>
    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
